[project]
name = "ccip-server"
version = "1.0.0"
description = ""
authors = ["OPass Dev Team <dev@opass.app>"]
license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "mongoengine>=0.29.1",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "preserve"
